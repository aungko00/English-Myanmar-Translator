name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          mkdir -p "${SDK_ROOT}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "${SDK_ROOT}/licenses/android-googletv-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "${SDK_ROOT}/licenses/intel-android-extra-license"

          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Cache Android Debug Keystore for Consistent In-Place Updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: me-translator-debug-keystore-v1

      - name: Compute App Version Metadata
        id: meta
        run: |
          BASE_MM=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          APP_VER="${BASE_MM}.${{ github.run_number }}"
          TAG_NAME="v${APP_VER}"
          VER_CODE=$((110 + ${{ github.run_number }}))
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 20)
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VER_CODE}" >> $GITHUB_OUTPUT
          {
            echo 'changelog<<__CHANGELOG_EOF__'
            echo "${COMMIT_MSG}"
            echo '__CHANGELOG_EOF__'
          } >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Static Web Bundle for Android
        run: |
          TARGET_REPO="${{ vars.RELEASE_REPO || github.repository }}"
          printf "export const APP_VERSION = '%s';\nexport const DEFAULT_GITHUB_REPO = '%s';\n" "${{ steps.meta.outputs.version }}" "${TARGET_REPO}" > lib/app-config.ts
          npm run build:capacitor

      - name: Initialize & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Version, Permissions & App Icons
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.meta.outputs.version_code }}/" "$BUILD_GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.meta.outputs.version }}\"/" "$BUILD_GRADLE"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          fi

          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi; do
            mkdir -p "$dir"
            cp public/pwa-192x192.png "$dir/ic_launcher.png"
            cp public/pwa-192x192.png "$dir/ic_launcher_round.png"
            cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
          done
          for dir in android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$dir"
            cp public/pwa-512x512.png "$dir/ic_launcher.png"
            cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
            cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
          done

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "ME-Translator-${{ steps.meta.outputs.tag }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-Translator-${{ steps.meta.outputs.tag }}-APK
          path: ME-Translator-${{ steps.meta.outputs.tag }}.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ME Translator ${{ steps.meta.outputs.tag }}"
          body: |
            ### What's New in ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.changelog }}

            **Direct Android Install:** Download `ME-Translator-${{ steps.meta.outputs.tag }}.apk` directly from inside the app or from the assets below.
          files: ME-Translator-${{ steps.meta.outputs.tag }}.apk
          make_latest: true
