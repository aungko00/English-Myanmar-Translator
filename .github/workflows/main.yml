name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Assets & Capacitor Sync
        run: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ME Translator</title>
              <style>
                body { margin: 0; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
              </style>
            </head>
            <body>
              <p>Loading Translator...</p>
              <script>
                window.location.href = "https://ais-pre-wwc3pj42cbvngycmanbtvf-403281914828.asia-east1.run.app";
              </script>
            </body>
          </html>
          EOF
          npx cap init "ME Translator" "com.metranslator.app" --web-dir out
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.metranslator.app",
            "appName": "ME Translator",
            "webDir": "out",
            "server": {
              "url": "https://ais-pre-wwc3pj42cbvngycmanbtvf-403281914828.asia-east1.run.app",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-Translator-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
